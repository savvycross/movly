name: Old URL redirect (GitHub Pages)

# The app now lives on Vercel. GitHub Pages only serves a tiny page that
# redirects https://savvycross.github.io/movly/ to VITE_SITE_URL (from .env),
# so old links keep working. Redeploys when the URL or the page changes.
on:
  push:
    branches: [main]
    paths:
      - .env
      - scripts/build-redirect.mjs
      - .github/workflows/pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/build-redirect.mjs redirect-dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
